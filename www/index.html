<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>PorkFree Scan</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f9fb;color:#182633}main{max-width:480px;margin:auto;padding:22px 18px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:12px 0 5px}.muted{color:#607080}button,select,input{font:inherit}button{border:0;border-radius:14px;background:#1266d6;color:white;padding:16px 22px;font-weight:700;width:100%;margin:8px 0}button.secondary{background:#e9eef5;color:#223}select{padding:8px;border:1px solid #ddd;border-radius:8px}.card{background:white;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 5px 20px #0001}#result{display:none;text-align:center;transition:background-color .2s ease}
